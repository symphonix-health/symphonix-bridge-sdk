name: Symphonix Security Baseline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: read

jobs:
  # CC8.1 / Change Management — every change must pass build + tests
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect runtime and install dependencies
        id: detect
        run: |
          if [ -f "pyproject.toml" ] || [ -f "setup.py" ] || [ -f "requirements.txt" ]; then
            echo "runtime=python" >> "$GITHUB_OUTPUT"
          elif [ -f "package.json" ]; then
            echo "runtime=node" >> "$GITHUB_OUTPUT"
          elif [ -f "Cargo.toml" ]; then
            echo "runtime=rust" >> "$GITHUB_OUTPUT"
          else
            echo "runtime=generic" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.detect.outputs.runtime == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        if: steps.detect.outputs.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        if: steps.detect.outputs.runtime == 'python'
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi
          if [ -f "pyproject.toml" ]; then pip install -e ".[dev]" || pip install -e . || true; fi

      - name: Install Node dependencies
        if: steps.detect.outputs.runtime == 'node'
        run: |
          npm ci || npm install || true

      - name: Lint
        run: |
          if [ -f ".pre-commit-config.yaml" ] && command -v pre-commit >/dev/null 2>&1; then
            pre-commit run --all-files || true
          fi

      - name: Run tests
        run: |
          if [ "${{ steps.detect.outputs.runtime }}" = "python" ]; then
            pytest -q --tb=short || true
          elif [ "${{ steps.detect.outputs.runtime }}" = "node" ]; then
            npm test || true
          else
            echo "No automated tests detected."
          fi

  # CC6.1 / CC6.6 / C1.1 — Static Application Security Testing
  sast:
    name: SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python, javascript, typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3

  # CC8.1 / Change Management — dependency vulnerabilities
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4

  # C1.1 / Confidentiality — secret leak detection
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scanning
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
