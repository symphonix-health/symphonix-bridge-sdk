# Pre-commit configuration -- Symphonix Health no-bypass enforcement.
#
# Runs the BulletTrain no-bypass gate against this repo on every commit so the
# no-mock / no-hardcoded-endpoint / no-stub-of-a-real-service policy is enforced
# locally. Baselined ratchet: scripts/ci/no_bypass_baseline.json grandfathers the
# existing debt -- drive it DOWN by de-mocking, never up to hide a new one. Only
# NEW violations block the commit. The gate is pure stdlib (no extra deps).
#
# Enable once per clone:  pre-commit install
repos:
  - repo: local
    hooks:
      - id: enforce-no-bypass
        name: enforce no-bypass (no mocks / hardcoded endpoints / stubs of real services)
        # Workspace root derived from the MAIN repo's .git (git rev-parse
        # --git-common-dir) so this entry also works from linked git worktrees,
        # where a ../-relative path resolves against the worktrees directory
        # and blocks every commit with "can't open file".
        entry: >-
          bash -c 'ws="$(dirname "$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")")";
          exec python "$ws/BulletTrain/scripts/ci/enforce_no_bypass.py" --root . --strict --baseline scripts/ci/no_bypass_baseline.json'
        language: system
        pass_filenames: false
        always_run: true
