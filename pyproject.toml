[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "symphonix-bridge-sdk"
version = "0.1.0"
description = "Protocol Bridge SDK — heterogeneous healthcare protocol translation with FHIR R4 canonical pivot"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Symphonix Health" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "fastapi>=0.115",
    "opentelemetry-exporter-otlp>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.45",
    "opentelemetry-instrumentation-httpx>=0.45",
    "opentelemetry-instrumentation-requests>=0.45",
    "opentelemetry-sdk>=1.24",
    "prometheus-client>=0.20",
    "python-json-logger>=2.0",
    "sentry-sdk[fastapi]>=2.0",
    "starlette>=0.37",
]

[project.optional-dependencies]
all = [
    "hl7>=0.4",
    "pydicom>=2.4",
    "confluent-kafka>=2.3",
    "grpcio>=1.60",
    "websockets>=12.0",
    "mcp>=1.0",
]
bullettrain = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bridge_sdk", "src/symphonix_bridge_sdk"]

[tool.pytest.ini_options]
markers = [
    "scenario: scenario tests",
    "monetisation: monetisation scenario tests",
    "helixcare: HelixCare-specific tests",
    "slow: slow / network-dependent tests",
    "integration: integration tests against real services",
    "visual: visual inspection tests requiring live servers and Playwright",
    "unit: unit tests",
    "contract: contract tests",
    "system: system / e2e tests",
    "acceptance: scenario acceptance tests",
    "e2e: end-to-end tests",
    "asyncio: async tests",
]
filterwarnings = [
    'ignore:datetime.datetime.utcnow.*:DeprecationWarning:pydantic.v1',
    'ignore::DeprecationWarning:langchain_core',
    'ignore:asyncio.iscoroutinefunction:DeprecationWarning',
    'ignore::jwt.warnings.InsecureKeyLengthWarning',
]
